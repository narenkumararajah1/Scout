# Serves the built SPA and proxies Scout's API from one origin.
#
# **One origin is the point.** The frontend calls relative paths -
# "/api/v1/...", "/companies", "/analytics" - so putting both behind this
# server means the browser never makes a cross-origin request, and CORS
# never has to be configured or reasoned about. CORS_ALLOWED_ORIGINS
# exists for deployments that split the two; this file is the shape that
# does not need it.
#
# **The hard part: three paths are both API routes and SPA routes.**
# /companies, /reports and /analytics are React Router routes *and*
# backend endpoints. Getting this wrong is not subtle - a user who
# refreshes the page on /companies, or opens a bookmark to it, gets raw
# JSON instead of the application. (This was found in real browser
# testing during development; vite.config.ts solves the same collision
# the same way for the dev server.)
#
# The discriminator is the Accept header: a browser navigating to a URL
# sends "text/html", and the app's own fetch() calls never do. So a
# request for /companies that wants HTML is a navigation and must be
# served index.html; one that does not is the SPA calling the API.

map $http_accept $wants_html {
    default            0;
    "~*text/html"      1;
}

server {
    listen 80;
    server_name _;

    # **Re-resolve the backend on every request, never cache its address.**
    #
    # An `upstream` block - or a literal hostname in proxy_pass - is
    # resolved once, when the configuration loads. Docker hands out a new
    # container IP whenever the backend is recreated (`docker compose
    # up -d` after any change to .env or the image), so nginx then holds
    # an address nobody answers on and every request 502s while the
    # backend is perfectly healthy. Observed in production: the backend
    # moved 172.18.0.2 -> 172.18.0.3 and the whole site went down until
    # nginx was restarted by hand.
    #
    # 127.0.0.11 is Docker's embedded DNS, present on every user-defined
    # network. `valid=10s` caps how long a resolved address is reused, so
    # a recreated backend is picked up within ten seconds unattended.
    # ipv6=off because the backend is v4-only and the AAAA lookup just
    # adds latency and log noise.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $scout_api http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads to the Knowledge Library; the backend's own cap is 25MB, so
    # this must not be the lower of the two or the backend's clear error
    # message is replaced by nginx's opaque 413.
    client_max_body_size 30m;

    # Long enough for an LLM round trip. Ask Scout and the generation
    # endpoints routinely take tens of seconds; nginx's 60s default
    # cuts them off mid-answer.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Recover the real client address when something else terminates TLS
    # in front of this (Caddy, on the VM deployment - see
    # docs/beta-deployment/VM_DEPLOYMENT.md).
    #
    # Without this, $remote_addr is the front proxy for every request, so
    # the address nginx appends below is the proxy's and every visitor
    # shares one bucket in the login rate limiter. Five wrong passwords
    # from anyone would then lock out everybody - a limiter that becomes
    # a denial of service.
    #
    # Only the private container network is trusted, never 0.0.0.0/0:
    # trusting everything would let any client set the header and choose
    # its own bucket, which is the same hole from the other direction.
    set_real_ip_from   172.16.0.0/12;
    set_real_ip_from   192.168.0.0/16;
    set_real_ip_from   10.0.0.0/8;
    real_ip_header     X-Forwarded-For;
    real_ip_recursive  on;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- the three ambiguous prefixes ---------------------------------
    # `if` is limited inside location blocks, but returning a status to
    # trigger error_page is one of the documented-safe uses. 418 is
    # arbitrary and never leaves nginx.
    location ~ ^/(companies|reports|analytics)(/|$) {
        error_page 418 = @spa;
        if ($wants_html) {
            return 418;
        }
        # Two different responses share one URL, so any cache in between
        # has to key on the header that chooses between them. Without
        # this the browser stores the SPA's index.html under
        # /companies/<id> after a navigation, and then answers the app's
        # own fetch() for that same URL out of cache - HTML where JSON
        # was expected. The company page rendered "data is undefined"
        # for every company; the API was fine and returned JSON to any
        # request that actually reached it.
        add_header Vary Accept always;
        # $request_uri is required, not decorative: the moment proxy_pass
        # contains a variable, nginx stops appending the matched URI on
        # its own and would proxy every request to "/". It carries the
        # query string too, so ?format=pdf and friends survive.
        proxy_pass $scout_api$request_uri;
    }

    location @spa {
        # Belt and braces with the Vary above: this HTML must never be
        # reused for a URL the API also answers, and revalidating it
        # costs nothing since it is a few hundred bytes of shell.
        add_header Cache-Control "no-store" always;
        add_header Vary Accept always;
        try_files /index.html =404;
    }

    # --- unambiguous API prefixes -------------------------------------
    # These are backend-only; no SPA route shares them, so no sniffing.
    location ~ ^/(api/v1|system|recipients|schedules|workflow|conversation|health)(/|$) {
        proxy_pass $scout_api$request_uri;
    }

    # --- static assets ------------------------------------------------
    # Vite fingerprints these filenames, so they can be cached hard and
    # forever; index.html must not be, or a deploy is invisible until
    # every user clears their cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- everything else is the SPA -----------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
